[workspace]
members = [
  "apps/desktop/src-tauri",
  "crates/asset-core",
  "crates/app-config",
  "crates/catalog",
  "crates/filesystem",
  "crates/format-worker",
  "crates/index",
  "crates/link-resolver",
  "crates/media",
  "crates/metadata",
  "crates/pdf",
  "crates/preview",
  "crates/resource-control",
  "crates/saved-filters",
  "crates/svg",
  "crates/transactions",
  "tools/eagle-p0",
  "tools/cache-fault",
  "tools/fixture-generator",
  "tools/format-gate",
  "tools/query-gate",
  "tools/query-scan-gate",
  "tools/resource-soak",
  "tools/sidecar-fault",
  "tools/transaction-fault",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
globset = { version = "=0.4.19", default-features = false }
imagesize = { version = "0.15.0", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
image = { version = "=0.25.9", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
lopdf = { version = "=0.42.0", default-features = false }
kamadak-exif = "0.6.1"
notify = "8"
resvg = { version = "=0.48.1", default-features = false }
roxmltree = { version = "=0.21.1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
symphonia = { version = "=0.6.1", default-features = false, features = ["id3v1", "id3v2", "isomp4", "mkv", "mp3", "wav"] }
tempfile = "3"
thiserror = "2"
usvg = { version = "=0.48.1", default-features = false }
tauri = "2.11.5"
tauri-build = "2.6.3"
uuid = { version = "1", features = ["serde", "v7"] }
unicode-normalization = "0.1"
unicode-casefold = "=0.2.0"
walkdir = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
