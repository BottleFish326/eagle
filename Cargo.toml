[workspace]
members = [
  "apps/desktop/src-tauri",
  "crates/asset-core",
  "crates/app-config",
  "crates/catalog",
  "crates/filesystem",
  "crates/index",
  "crates/link-resolver",
  "crates/metadata",
  "crates/preview",
  "crates/resource-control",
  "crates/transactions",
  "tools/eagle-p0",
  "tools/cache-fault",
  "tools/fixture-generator",
  "tools/resource-soak",
  "tools/sidecar-fault",
  "tools/transaction-fault",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
infer = "0.19"
globset = { version = "=0.4.19", default-features = false }
imagesize = { version = "0.15.0", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
image = { version = "=0.25.9", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
kamadak-exif = "0.6.1"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tauri = "2.11.5"
tauri-build = "2.6.3"
uuid = { version = "1", features = ["serde", "v7"] }
unicode-normalization = "0.1"
walkdir = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
