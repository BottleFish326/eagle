name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform-paths:
    name: Path compatibility (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Install Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Enable Windows long-path policy
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-ItemProperty `
            -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' `
            -Name LongPathsEnabled `
            -Value 1 `
            -PropertyType DWord `
            -Force

      - name: Run P2-A12 path compatibility suite
        env:
          MATERIAL_EAGLE_REQUIRE_WINDOWS_SYMLINK: ${{ runner.os == 'Windows' && '1' || '0' }}
          MATERIAL_EAGLE_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: node tools/verify-platform-paths.mjs --output "${{ runner.temp }}/p2-a12-platform-paths.json"

      - name: Report P2-A12 rejection details
        if: failure()
        run: node tools/report-platform-path-failure.mjs --input "${{ runner.temp }}/p2-a12-platform-paths.json"

      - name: Archive P2-A12 machine-readable evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p2-a12-source-${{ runner.os }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p2-a12-platform-paths.json
          if-no-files-found: error
          retention-days: 90

  platform-matrix-evidence:
    name: Consolidate path compatibility evidence
    if: ${{ always() }}
    needs: platform-paths
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Download P2-A12 platform evidence
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: p2-a12-source-*-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p2-a12-input

      - name: Verify and consolidate P2-A12 evidence
        env:
          MATERIAL_EAGLE_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: node tools/verify-platform-matrix.mjs --input-directory "${{ runner.temp }}/p2-a12-input" --output "${{ runner.temp }}/p2-08-platform-matrix.json"

      - name: Archive consolidated P2-A12 verdict
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p2-a12-matrix-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p2-08-platform-matrix.json
          if-no-files-found: error
          retention-days: 90

  quality:
    name: Format, test, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EAGLE_GIT_COMMIT: ${{ github.sha }}
      RUST_BACKTRACE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Install Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      - name: Install JavaScript dependencies
        run: |
          npm ci
          npm ci --prefix apps/desktop
          npm ci --prefix integrations/obsidian-bridge

      - name: Run P1-01 quality gate
        run: npm run ci

  libheif-worker:
    name: Fixed libheif worker backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install fixed worker build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            cmake \
            libaom-dev \
            libde265-dev \
            pkg-config

      - name: Install fixed worker build dependencies
        if: runner.os == 'macOS'
        run: brew install aom cmake libde265 pkg-config

      - name: Install Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy

      - name: Verify fixed libheif backend
        run: |
          cargo clippy -p format-worker --all-targets --features embedded-libheif -- -D warnings
          cargo test -p format-worker --all-targets --features embedded-libheif

      - name: Build and verify fixed worker bundle
        env:
          MATERIAL_EAGLE_WORKER_PLATFORM: ${{ runner.os == 'macOS' && 'macos' || 'linux' }}
          MATERIAL_EAGLE_WORKER_ARCHITECTURE: ${{ runner.arch == 'ARM64' && 'aarch64' || 'x86_64' }}
        run: |
          cargo build -p format-worker --release --bin material-eagle-format-worker --features embedded-libheif
          node tools/package-format-worker.mjs \
            --binary target/release/material-eagle-format-worker \
            --output-directory "${{ runner.temp }}/format-worker-bundle" \
            --platform "$MATERIAL_EAGLE_WORKER_PLATFORM" \
            --architecture "$MATERIAL_EAGLE_WORKER_ARCHITECTURE"
          cargo run --quiet -p format-worker --bin material-eagle-verify-worker-bundle -- \
            "${{ runner.temp }}/format-worker-bundle"

      - name: Archive verified worker bundle
        uses: actions/upload-artifact@v7
        with:
          name: p3-01c-libheif-worker-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/format-worker-bundle
          if-no-files-found: error
          retention-days: 30
