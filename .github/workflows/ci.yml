name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform-paths:
    name: Path compatibility (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Install Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Enable Windows long-path policy
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-ItemProperty `
            -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' `
            -Name LongPathsEnabled `
            -Value 1 `
            -PropertyType DWord `
            -Force

      - name: Run P2-A12 path compatibility suite
        env:
          MATERIAL_EAGLE_REQUIRE_WINDOWS_SYMLINK: ${{ runner.os == 'Windows' && '1' || '0' }}
          MATERIAL_EAGLE_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: node tools/verify-platform-paths.mjs --output "${{ runner.temp }}/p2-a12-platform-paths.json"

      - name: Archive P2-A12 machine-readable evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p2-a12-${{ runner.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/p2-a12-platform-paths.json
          if-no-files-found: error
          retention-days: 90

  quality:
    name: Format, test, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EAGLE_GIT_COMMIT: ${{ github.sha }}
      RUST_BACKTRACE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Install Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      - name: Install JavaScript dependencies
        run: |
          npm ci --prefix apps/desktop
          npm ci --prefix integrations/obsidian-bridge

      - name: Run P1-01 quality gate
        run: npm run ci
