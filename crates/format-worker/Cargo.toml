[package]
name = "format-worker"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
image = { workspace = true, optional = true }
libheif-rs = { version = "=3.0.0", default-features = false, features = ["v1_23"], optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
uuid.workspace = true

[features]
default = []
embedded-libheif = ["libheif-backend", "libheif-rs/embedded-libheif"]
libheif-backend = ["dep:image", "dep:libheif-rs"]

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "material-eagle-format-worker"
path = "src/bin/format_worker.rs"

[[bin]]
name = "material-eagle-format-worker-fixture"
path = "src/bin/format_worker_fixture.rs"

[[bin]]
name = "material-eagle-verify-worker-bundle"
path = "src/bin/verify_worker_bundle.rs"

[lints]
workspace = true
